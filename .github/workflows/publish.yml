name: Publish artifacts

# Regenerates API JSON, OG images, static post HTML, Atom feed, sitemap on main.
# PDF build is a separate job (TeX Live is heavy) and commits when it produces changes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_pdfs:
        description: "Also build PDFs (pandoc + TeX Live)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-artifacts
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Avoid infinite loops when this workflow commits regenerated artifacts.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blogq + Pillow
        run: |
          python -m pip install --upgrade pip
          pip install -e "tools/blogq[dev]"
          pip install pillow

      - name: Validate posts.json
        run: blogq check posts.json

      - name: Run blogq unit tests
        run: pytest tools/blogq/tests -q

      - name: Build static API
        run: node scripts/build-static-api.js

      - name: Build OG images
        run: python3 scripts/build-og-images.py

      - name: Build static post pages
        run: node scripts/build-static-pages.js

      - name: Generate Atom feed
        run: node tools/generate-feed.js

      - name: Generate sitemap
        run: node tools/generate-sitemap.js

      - name: SEO readiness check
        run: node tools/check-seo.js

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ posts/ feed.xml sitemap.xml assets/js/build-id.js assets/og/ index.html
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore: regenerate static artifacts [skip ci]"
            git push
          fi

  pdfs:
    runs-on: ubuntu-latest
    needs: publish
    # On push: always attempt PDFs after publish. On manual runs: respect input.
    if: >
      always() &&
      needs.publish.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_pdfs))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pick up commit from publish job if it just pushed
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pandoc + TeX Live (xelatex)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            fonts-texgyre \
            fonts-inconsolata

      - name: Build PDFs
        run: node scripts/build-pdfs.mjs

      - name: Commit PDF artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdfs/
          if git diff --staged --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "chore: regenerate PDF artifacts [skip ci]"
            git push
          fi
