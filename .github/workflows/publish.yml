name: Publish artifacts

# Regenerates API JSON, static post HTML, Atom feed, and sitemap on main.
# PDFs stay local-only (pandoc + TeX Live are heavy for CI).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-artifacts
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Avoid infinite loops when this workflow commits regenerated artifacts.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blogq
        run: |
          python -m pip install --upgrade pip
          pip install -e "tools/blogq[dev]"

      - name: Validate posts.json
        run: blogq check posts.json

      - name: Run blogq unit tests
        run: pytest tools/blogq/tests -q

      - name: Build static API
        run: node scripts/build-static-api.js

      - name: Build static post pages
        run: node scripts/build-static-pages.js

      - name: Generate Atom feed
        run: node tools/generate-feed.js

      - name: Generate sitemap
        run: node tools/generate-sitemap.js

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ posts/ feed.xml sitemap.xml assets/js/build-id.js
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore: regenerate static artifacts [skip ci]"
            git push
          fi
